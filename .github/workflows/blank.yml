name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Initialize Android Project Structure
        run: |
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            echo 'rootProject.name = "xiomi-assistant"' > settings.gradle.kts
            echo 'include(":app")' >> settings.gradle.kts
          fi
          gradle wrapper --gradle-version 8.2.2
          chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android Project & Build
        run: |
          # Tạo AndroidManifest.xml cơ bản nếu chưa có
          mkdir -p app/src/main
          if [ ! -f app/src/main/AndroidManifest.xml ]; then
            cat <<EOF > app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.xiomiassistant">
              <application
                  android:label="Xiomi Assistant"
                  android:supportsRtl="true">
              </application>
          </manifest>
          EOF
          fi

          # Khởi tạo Gradle Wrapper & Build
          gradle wrapper --gradle-version 8.2.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
